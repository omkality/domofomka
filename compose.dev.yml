# Общие сервисы определены один раз; здесь только отличия dev.
# !override требует Docker Compose >= 2.24.4 и не подмешивает .env prod.
name: domofomka-dev
services:
  queue:
    extends:
      file: docker-compose.yml
      service: queue
  api:
    extends:
      file: docker-compose.yml
      service: api
    env_file: !override ['${DOMOFOMKA_ENV_FILE:-.env.dev}']
    ports: !override ['127.0.0.1:${API_PUBLISH_PORT:-${DEV_API_PORT:-18000}}:${API_PORT:-8000}']
  vkbot:
    extends:
      file: docker-compose.yml
      service: vkbot
    env_file: !override ['${DOMOFOMKA_ENV_FILE:-.env.dev}']
volumes:
  queue-data:
