name: Pytest worker comparison
on:
  push:
    branches: [dev]
    paths: [.github/workflows/pytest-xdist-benchmark.yml]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.13.7'
          python-version: '3.12.16'
      - run: uv sync --frozen --all-groups
      - name: Build the two real images once for every comparison
        run: |
          docker build -t domofomka-xdist-api -f Dockerfile.api .
          docker build -t domofomka-xdist-bot -f Dockerfile.vkbot .
      - name: Compare the same suite on the same runner in both orders
        env:
          TEST_API_IMAGE: domofomka-xdist-api
          TEST_VKBOT_IMAGE: domofomka-xdist-bot
        run: |
          mkdir -p artifacts/pytest-workers
          uv run --frozen --all-groups python -u - <<'PY' > artifacts/pytest-workers/resources.jsonl &
          import json, time
          from pathlib import Path
          import docker
          client = docker.from_env(timeout=5)
          while True:
              containers = []
              for container in client.containers.list(filters={"label": "domofomka.test"}):
                  try:
                      stats = client.api.stats(container.id, stream=False, one_shot=True)
                      memory = stats.get("memory_stats", {})
                      containers.append({"id": container.id, "kind": container.labels["domofomka.test"],
                          "memory": memory.get("usage", 0) - memory.get("stats", {}).get("inactive_file", 0),
                          "cpu_ns": stats.get("cpu_stats", {}).get("cpu_usage", {}).get("total_usage", 0)})
                  except docker.errors.APIError:
                      pass
              available = next(line for line in Path("/proc/meminfo").read_text().splitlines() if line.startswith("MemAvailable:"))
              print(json.dumps({"time": time.time(), "containers": containers, "available_kib": int(available.split()[1])}), flush=True)
              time.sleep(1)
          PY
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          for profile in 0:a 1:a 2:a 4:a 4:b 2:b 1:b 0:b; do
            workers=${profile%:*}
            round=${profile#*:}
            label="workers-$workers-$round"
            date +%s.%N > "artifacts/pytest-workers/$label.start"
            /usr/bin/time -v -o "artifacts/pytest-workers/$label.time" \
              uv run --frozen --all-groups python -m pytest -q -p no:cacheprovider \
              -n "$workers" --durations=10 --junitxml="artifacts/pytest-workers/$label.xml" \
              > "artifacts/pytest-workers/$label.log" 2>&1
            date +%s.%N > "artifacts/pytest-workers/$label.end"
            tail -n 12 "artifacts/pytest-workers/$label.log"
            test -z "$(docker ps -aq --filter label=domofomka.test)"
          done
      - name: Save timings, outcomes and resource samples
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pytest-worker-comparison
          path: artifacts/pytest-workers
          retention-days: 14
