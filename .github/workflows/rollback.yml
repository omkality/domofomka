name: Rollback application
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Restore previous healthy application images (database is preserved)
        type: choice
        options: [dev, prod]
        default: dev
        required: true
      restore:
        description: Previous release or the frozen v1 baseline (prod only)
        type: choice
        options: [previous, legacy-v1]
        default: previous
        required: true
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    steps:
      - env:
          REF: ${{ github.ref }}
          TARGET: ${{ inputs.environment }}
          PROD_ENABLED: ${{ vars.PROD_DEPLOY_ENABLED }}
          RESTORE: ${{ inputs.restore }}
        run: |
          if [ "$TARGET" = dev ]; then test "$REF" = refs/heads/dev;
          else test "$REF" = refs/heads/master && test "$PROD_ENABLED" = true; fi
          if [ "$RESTORE" = legacy-v1 ]; then test "$TARGET" = prod; fi
  rollback:
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore previous release
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST_KEYS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_ACTION: ${{ inputs.restore == 'legacy-v1' && 'rollback-legacy' || 'rollback' }}
        run: |
          umask 077
          export DEPLOY_KEY_FILE="$RUNNER_TEMP/deploy-key"
          export DEPLOY_KNOWN_HOSTS_FILE="$RUNNER_TEMP/deploy-hosts"
          trap 'rm -f "$DEPLOY_KEY_FILE" "$DEPLOY_KNOWN_HOSTS_FILE"' EXIT
          printf '%s\n' "$KEY" > "$DEPLOY_KEY_FILE"
          printf '%s\n' "$HOST_KEYS" > "$DEPLOY_KNOWN_HOSTS_FILE"
          python tools/operations/ci_send.py
