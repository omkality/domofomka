name: Refresh release documentation
on:
  release:
    types: [published, edited, unpublished, deleted]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: documentation-pages
      cancel-in-progress: false
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      DOCS_BASE_PATH: /domofomka
      DOCS_SITE_URL: https://omkality.github.io
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install locked documentation dependencies
        working-directory: docs
        run: npm ci --engine-strict --ignore-scripts --no-fund
      - name: Audit documentation dependencies
        working-directory: docs
        run: npm audit --audit-level=moderate
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Fetch releases, validate and build the site
        working-directory: docs
        run: npm run build
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs/dist
      - name: Publish checked documentation
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
