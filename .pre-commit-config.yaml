repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # Docker Compose использует стандартный для него тег !override.
      - id: check-added-large-files
        args: ['--maxkb=2048']
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: black
        name: Black (uv.lock)
        entry: uv run --frozen --all-groups black --config=pyproject.toml
        language: system
        types: [python]
      - id: ruff
        name: Ruff and concise docstrings (uv.lock)
        entry: uv run --frozen --all-groups ruff check --fix --config=ruff.toml --exit-non-zero-on-fix
        language: system
        types: [python]
      - id: mypy
        name: Mypy (uv.lock)
        entry: uv run --frozen --all-groups mypy --config-file=mypy.ini
        language: system
        types: [python]
        files: ^(src|ops|tools)/
      - id: explicit-environment-examples
        name: Complete and consistently ordered environment examples
        entry: uv run --frozen --all-groups python -m tools.configuration.environment --check-examples
        language: system
        pass_filenames: false
        always_run: true
      - id: sql-layout
        name: SQL layout and keyword style
        entry: uv run --frozen --all-groups sqlfluff lint --disable-progress-bar
        language: system
        types: [sql]
