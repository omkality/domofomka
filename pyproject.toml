[project]
name = "domofomka"
version = "2.0.2"
description = "Application for getting the intercom code at the given address"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
api = [
    "granian>=2.7.4,<3",
    "litestar>=2.22.0,<3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.14.2,<3",
    "psycopg[binary]>=3.3.6,<4",
    "httpx>=0.28.1,<0.29",
    "rapidfuzz>=3.14,<4",
]
dev = [
    "black>=26.1.0",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.14",
    "pip-audit>=2.10.1,<3",
    "sqlparse>=0.6.1,<0.7",
    "sqlfluff>=4.5,<5",
    "testcontainers>=4.15,<5",
]
migrations = [
    "psycopg[binary]>=3.3.6,<4",
    "pydantic-settings>=2.14.2,<3",
    "yoyo-migrations>=9,<10",
]
vkbot = [
    "psycopg[binary]>=3.2.0,<4",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.14.2,<3",
    "httpx>=0.28.1,<0.29",
    "requests>=2.33.0,<3",
    "vk-api>=11.10.0",
]

[tool.black]
line-length = 120

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
