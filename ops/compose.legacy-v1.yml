# Только замороженный откат первого выпуска v2. Redis сохраняется до его приёмки.
services:
  api:
    command: uv run --frozen granian --interface asgi src.api.app:app --host ${API_HOST:-0.0.0.0} --port ${API_PORT:-8000} --workers ${WORKERS_NUM:-1} --log --access-log
    # Замороженный образ v1 не содержит wget; его зависимости не изменяем.
    healthcheck:
      test: [CMD, python, -c, "import http.client,os; c=http.client.HTTPConnection('127.0.0.1',int(os.environ.get('API_PORT','8000')),timeout=3); c.request('GET','/version'); raise SystemExit(0 if c.getresponse().status==200 else 1)"]
    environment:
      UV_NO_SYNC: '1'
      UV_NO_CACHE: '1'
    volumes:
      - ${LEGACY_SNAPSHOT_ROOT:?Set LEGACY_SNAPSHOT_ROOT}/src:/backend/src:ro
  vkbot:
    command: uv run --frozen python -m src.vkbot.main
    environment:
      UV_NO_SYNC: '1'
      UV_NO_CACHE: '1'
    volumes:
      - ${LEGACY_SNAPSHOT_ROOT}/src:/backend/src:ro
      - ${LEGACY_SNAPSHOT_ROOT}/start_message.txt:/backend/start_message.txt:ro
