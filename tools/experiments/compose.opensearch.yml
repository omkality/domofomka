# Только локальное сравнение: требуется явный профиль search-comparison.
name: domofomka-search-comparison
services:
  opensearch:
    profiles: [search-comparison]
    image: opensearchproject/opensearch:3.3.2@sha256:798cf28e226a32f5c928dd1ed9478dd3a33d2212176aad3679020088ad3afa1a
    restart: unless-stopped
    mem_limit: ${OPENSEARCH_MEM_LIMIT:-3g}
    memswap_limit: ${OPENSEARCH_MEM_LIMIT:-3g}
    pids_limit: 512
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      OPENSEARCH_JAVA_OPTS: '-Xms1g -Xmx1g'
    ports: ['127.0.0.1:19200:9200']
    volumes: ['search-data:/usr/share/opensearch/data']
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
volumes:
  search-data:
