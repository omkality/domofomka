name: domofomka-documentation
services:
  docs:
    image: nginx:1.30.6-alpine@sha256:901e593c95dc85f5a729f5765516321366ef4ac401821431d408897e95287d0a
    container_name: domofomka-docs
    entrypoint: [nginx, -g, 'daemon off;']
    user: '101:101'
    ports: ['127.0.0.1:4321:8080']
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs: ['/tmp:size=8m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.25
    pids_limit: 32
    logging:
      driver: json-file
      options: {max-size: 1m, max-file: '2'}
    healthcheck:
      test: [CMD, wget, -q, -T, '2', -O, /dev/null, 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 3s
      retries: 3
